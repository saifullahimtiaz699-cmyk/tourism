services:
  - type: web
    name: tourism-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        value: https://saifullahimtiaz699-cmyk.github.io/tourism
      - key: NODE_ENV
        value: production
